name: Engineering checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install capture and QA tools
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y tshark xvfb xauth
          tshark --version
          python -m pip install -r requirements-dev.txt
      - name: Lint and static security analysis
        run: |
          ruff check .
          ruff format --check .
          bandit -q -r analyzer STUN.py
      - name: Unit tests and controlled PCAP replay
        run: python -m unittest discover -v
      - name: Open and close the GUI
        run: xvfb-run -a python -c 'import tkinter as tk; from analyzer.gui import Analyzer; r=tk.Tk(); app=Analyzer(r); r.after(150,app.close); r.mainloop()'
      - name: Capture on isolated routed and SNAT networks
        run: sudo bash tests/network/lab.sh "$(command -v python)"
